# Frontend — https://devlin.aairavx.com
app = "devlin-aairavx"
primary_region = "lhr"

[build]
  [build.args]
    VITE_AGENT_URL = "https://api.devlin.aairavx.com"
    # VITE_AGENT_API_KEY is passed at deploy time: fly deploy --build-arg VITE_AGENT_API_KEY=...

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
